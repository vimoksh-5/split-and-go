syntax = "proto3";

package splitandgo.v1;

option go_package = "github.com/vimoksh-5/split-and-go/pkg/transport/grpc/pb;pb";

enum ChecksumType {
  CHECKSUM_TYPE_UNSPECIFIED = 0;
  CHECKSUM_TYPE_NONE = 1;
  CHECKSUM_TYPE_CRC32 = 2;
  CHECKSUM_TYPE_SHA256 = 3;
}

message ChunkEnvelope {
  string session_id = 1;
  int64 sequence = 2;
  int64 offset = 3;
  int64 total_chunks = 4;
  int64 total_bytes = 5;
  bytes data = 6;
  uint32 checksum = 7;
  bytes checksum_bytes = 8;
  ChecksumType checksum_type = 9;
  bool is_last = 10;
  bool is_compressed = 11;
  map<string, string> metadata = 12;
}

message StreamAck {
  string session_id = 1;
  int64 chunks_received = 2;
  int64 bytes_received = 3;
  bool success = 4;
  string error_message = 5;
}

message StreamDownloadRequest {
  string resource_id = 1;
  int32 preferred_chunk_size = 2;
  map<string, string> metadata = 3;
}

service StreamService {
  // StreamUpload receives a stream of chunks from the client
  rpc StreamUpload(stream ChunkEnvelope) returns (StreamAck);

  // StreamDownload sends a stream of chunks to the client
  rpc StreamDownload(StreamDownloadRequest) returns (stream ChunkEnvelope);

  // StreamBidi enables bidirectional chunk streaming
  rpc StreamBidi(stream ChunkEnvelope) returns (stream ChunkEnvelope);
}
